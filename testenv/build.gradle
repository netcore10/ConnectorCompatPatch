plugins {
    id 'net.neoforged.moddev' version '2.0.148'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

// No sources: this project only runs NeoForge with jars in run/mods, the same way a Modrinth profile loads them
neoForge {
    version = neo_version
    runs {
        client { client() }
        // Force-applies all mixins at load-complete and logs every failure (see ConnectorCompatMod)
        auditClient {
            client()
            systemProperty 'connectorcompat.mixinAudit', 'true'
        }
        // Straight into an existing save: reproduces world-load problems without clicking through menus
        worldClient {
            client()
            programArguments.addAll '--quickPlaySingleplayer', (project.findProperty('world') ?: 'New World')
        }
        gameTestServer { type = 'gameTestServer' }
        configureEach {
            gameDirectory = file('run')
            systemProperty 'neoforge.warnings.logofile.hide', 'true'
            systemProperty 'neoforge.warnings.onlyin.hide', 'true'
        }
    }
}

// -Pbare: only Connector, Launchpad and Fabric API (no patch, no Create Fly), to tell whether a problem is ours
// -PextraMods=a*.jar,b*.jar: only those jars from extra-mods
def bare = project.hasProperty('bare')
def installMods = tasks.register('installMods', Sync) {
    if (!bare) {
        dependsOn ':plugin:jar'
        from(project(':plugin').tasks.named('jar'))
    }
    from("${rootDir}/libs") {
        include connector_jar, launchpad_jar, fabric_api_jar
        if (!bare) include create_fly_jar
    }
    // Optional: more of the real pack (git-ignored), to reproduce pack-only problems
    from('extra-mods') { include((project.findProperty('extraMods') ?: '*.jar').split(',')) }
    into 'run/mods'
}

// Connector caches transformed jars by Connector version + input bytes only, not by plugins,
// so wipe its cache whenever the patch changes
def clearConnectorCache = tasks.register('clearConnectorCache', Delete) {
    delete 'run/.cache/connector'
}

tasks.matching { it.name in ['prepareClientRun', 'prepareAuditClientRun', 'prepareWorldClientRun', 'prepareGameTestServerRun'] }.configureEach {
    dependsOn installMods, clearConnectorCache
}
