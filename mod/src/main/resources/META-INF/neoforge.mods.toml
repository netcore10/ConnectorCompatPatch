modLoader="javafml"
loaderVersion="*"
license="MIT"

[[mods]]
modId="connector_compat_patch"
version="${mod_version}"
displayName="Connector Compat Patch"
description='''
Fixes Fabric mods that break on NeoForge 26.2 under Sinytra Connector, alongside the mods themselves (Create Fly and its addons included).
'''

[[mixins]]
config="connector_compat_patch.mixins.json"

[[mixins]]
config="connector_compat_patch.create.mixins.json"

[[mixins]]
config="connector_compat_patch.bclib.mixins.json"

[[mixins]]
config="connector_compat_patch.wover_events.mixins.json"

[[dependencies.connector_compat_patch]]
modId="connector"
type="required"
versionRange="*"
ordering="AFTER"
side="BOTH"

[[dependencies.connector_compat_patch]]
modId="create"
type="optional"
versionRange="*"
ordering="AFTER"
side="BOTH"

[[accessTransformers]]
file="META-INF/accesstransformer.cfg"
