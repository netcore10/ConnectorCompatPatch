pluginManagement {
    repositories {
        gradlePluginPortal()
        maven { url = 'https://maven.neoforged.net/releases' }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'createfly-connector-patch'

// mod: NeoForge-native replacements (nested jar-in-jar)
// plugin: Connector TransformerPlugin; the outer jar that goes in mods/
// testenv: dev NeoForge client/server with Connector + Create Fly + the built patch jar in run/mods
include 'mod', 'plugin', 'testenv'
